name: check-html-scripts

on:
  push:
  pull_request:

jobs:
  inline-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check slideshow HTML inline scripts
        run: node scripts/check-html-scripts.mjs
      - name: Unit tests
        run: node --test slidex-core.test.mjs
