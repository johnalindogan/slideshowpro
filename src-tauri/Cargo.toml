[package]
name = "slideshowpro"
version = "0.1.0"
description = "Thin Tauri Windows wrapper for SlideShowX"
authors = ["johnalindogan"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "slideshowpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
url = "2"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
